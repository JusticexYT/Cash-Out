<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawal ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --paper: #F5F1E7;
    --paper-line: #DBD4C0;
    --ink: #24304A;
    --ink-soft: #5B6479;
    --rust: #9C4331;
    --rust-soft: #C98B78;
    --brass: #A9822F;
    --green: #3E6B4F;
    --card: #FBF9F4;
    --danger-bg: #F6E3DE;
  }
  html[data-theme="dark"]{
    --paper: #1B1E24;
    --paper-line: #383D47;
    --ink: #ECE7DA;
    --ink-soft: #9A9FAC;
    --rust: #E08A6E;
    --rust-soft: #B96A50;
    --brass: #D8B45B;
    --green: #7FBE94;
    --card: #23262E;
    --danger-bg: #3A2A28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    min-height:100vh;
    padding:40px 20px 80px;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:16px;
  }
  h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:0.2px;
  }
  h1 span{color:var(--rust);}
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .month-total{text-align:right;}
  .month-total .label{font-size:11px;color:var(--ink-soft);letter-spacing:0.5px;}
  .month-total .value{font-size:24px;font-weight:500;color:var(--rust);}
  select, .textbtn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    border:1px solid var(--ink-soft);
    background:var(--card);
    color:var(--ink);
    padding:6px 8px;
    cursor:pointer;
  }
  button{font-family:'IBM Plex Mono', monospace;cursor:pointer;}
  .icon-toggle{
    border:1px solid var(--ink-soft);
    background:var(--card);
    color:var(--ink);
    font-size:14px;
    padding:6px 10px;
  }
  .icon-toggle:hover{background:var(--ink);color:var(--paper);}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .toolbar .group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toolbar label{font-size:11px;color:var(--ink-soft);}

  .banner{
    border:1px solid var(--brass);
    background:var(--card);
    color:var(--ink);
    padding:10px 14px;
    font-size:13px;
    margin-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .banner.hide{display:none;}
  .banner button{
    background:none;border:none;color:var(--ink-soft);font-size:13px;
  }

  .budget-box{
    border:1px solid var(--paper-line);
    background:var(--card);
    padding:14px 16px;
    margin-bottom:20px;
  }
  .budget-box .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
  .budget-box input[type=number]{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    border:1px solid var(--ink-soft);
    background:var(--paper);
    color:var(--ink);
    padding:6px 8px;
    width:100px;
  }
  .bar-track{height:10px;background:var(--paper-line);width:100%;}
  .bar-fill{height:10px;background:var(--green);transition:width 0.2s ease, background 0.2s ease;}
  .bar-fill.over{background:var(--rust);}
  .streak{font-size:12px;color:var(--ink-soft);margin-top:6px;}

  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .nav button.arrow{
    background:none;border:1px solid var(--ink);color:var(--ink);
    font-size:16px;width:34px;height:34px;
  }
  .nav button.arrow:hover{background:var(--ink);color:var(--paper);}
  .nav .month-label{font-family:'Source Serif 4', serif;font-size:19px;font-weight:600;}
  .nav .view-toggle{display:flex;gap:6px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--paper-line);
    border-left:1px solid var(--paper-line);
  }
  .dow{
    font-size:11px;text-align:center;padding:8px 0;color:var(--ink-soft);
    letter-spacing:0.5px;border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);
  }
  .cell{
    min-height:78px;border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);
    padding:8px 6px;cursor:pointer;background:var(--card);position:relative;transition:background 0.12s ease;
  }
  .cell:hover{background:var(--paper-line);}
  .cell.empty{background:transparent;cursor:default;}
  .cell.selected{outline:2px solid var(--ink);outline-offset:-2px;}
  .cell .daynum{font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;}
  .cell.has-entry .daynum{color:var(--ink);font-weight:500;}
  .cat-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .cell .amount{margin-top:10px;font-size:14px;font-weight:500;color:var(--rust);}
  .cell .rec-icon{font-size:10px;color:var(--brass);}
  .cell.today .daynum{color:var(--brass);font-weight:600;}

  .panel{margin-top:24px;border:1px solid var(--ink);background:var(--card);padding:20px 22px;}
  .panel .date-title{font-family:'Source Serif 4', serif;font-size:18px;font-weight:600;margin:0 0 14px;}
  .panel-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .panel-row label{font-size:12px;color:var(--ink-soft);}
  .panel input[type=number]{
    font-family:'IBM Plex Mono', monospace;font-size:16px;border:1px solid var(--ink-soft);
    background:var(--paper);color:var(--ink);padding:8px 10px;width:140px;
  }
  .panel input[type=text]{
    font-family:'IBM Plex Mono', monospace;font-size:14px;border:1px solid var(--ink-soft);
    background:var(--paper);color:var(--ink);padding:8px 10px;flex:1;min-width:160px;
  }
  .panel select{padding:8px 10px;font-size:13px;}
  .panel .checkbox-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .panel button.primary{
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:13px;
  }
  .panel button.secondary{background:none;color:var(--rust);border:1px solid var(--rust-soft);padding:9px 16px;font-size:13px;}
  .panel button:hover{opacity:0.85;}
  .panel .actions{margin-top:4px;display:flex;gap:10px;}
  .empty-hint{font-size:13px;color:var(--ink-soft);}
  .status{font-size:11px;color:var(--ink-soft);margin-top:6px;min-height:14px;}

  .search-row{display:flex;gap:10px;margin:26px 0 10px;flex-wrap:wrap;align-items:center;}
  .search-row input[type=text]{
    font-family:'IBM Plex Mono', monospace;font-size:13px;border:1px solid var(--ink-soft);
    background:var(--card);color:var(--ink);padding:8px 10px;flex:1;min-width:160px;
  }

  .list h2{
    font-family:'Source Serif 4', serif;font-size:16px;font-weight:600;
    border-bottom:1px solid var(--paper-line);padding-bottom:8px;margin-bottom:4px;
  }
  .list-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--paper-line);font-size:13px;gap:10px;}
  .list-row .d{color:var(--ink-soft);width:70px;flex-shrink:0;}
  .list-row .n{color:var(--ink);flex:1;}
  .list-row .c{color:var(--ink-soft);font-size:11px;width:80px;flex-shrink:0;}
  .list-row .a{color:var(--rust);font-weight:500;width:90px;text-align:right;flex-shrink:0;}

  .stats-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0;
  }
  .stat-card{border:1px solid var(--paper-line);background:var(--card);padding:12px 14px;}
  .stat-card .label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .stat-card .value{font-size:18px;font-weight:500;}

  .section-title{
    font-family:'Source Serif 4', serif;font-size:16px;font-weight:600;
    border-bottom:1px solid var(--paper-line);padding-bottom:8px;margin:34px 0 14px;
  }

  .chart-box{border:1px solid var(--paper-line);background:var(--card);padding:16px;margin-bottom:24px;}

  .cat-breakdown-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;}
  .cat-breakdown-row .name{width:100px;flex-shrink:0;display:flex;align-items:center;gap:6px;}
  .cat-breakdown-row .bar-track{flex:1;}
  .cat-breakdown-row .pct{width:50px;text-align:right;color:var(--ink-soft);font-size:12px;}

  .year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .year-cell{border:1px solid var(--paper-line);background:var(--card);padding:10px 12px;cursor:pointer;}
  .year-cell:hover{background:var(--paper-line);}
  .year-cell .m{font-size:12px;color:var(--ink-soft);}
  .year-cell .t{font-size:15px;font-weight:500;color:var(--rust);margin-top:4px;}

  .data-box{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .data-box button, .data-box label.filebtn{
    border:1px solid var(--ink-soft);background:var(--card);color:var(--ink);
    padding:8px 14px;font-size:12px;
  }
  .data-box button:hover, .data-box label.filebtn:hover{background:var(--ink);color:var(--paper);}
  .data-box input[type=file]{display:none;}
  .import-box{margin-top:14px;}
  .import-box textarea{
    width:100%;min-height:70px;font-family:'IBM Plex Mono', monospace;font-size:12px;
    border:1px solid var(--ink-soft);background:var(--paper);color:var(--ink);padding:8px;
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 18px;font-size:13px;
    display:flex;gap:14px;align-items:center;z-index:50;
  }
  .toast button{background:none;border:1px solid var(--paper);color:var(--paper);padding:4px 10px;font-size:12px;}
  .toast.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Withdrawal <span>ledger</span></h1>
    <div class="header-right">
      <select id="accountSelect"></select>
      <button class="icon-toggle" id="addAccountBtn" title="Add account">+ account</button>
      <select id="currencySelect">
        <option value="$">$</option>
        <option value="€">€</option>
        <option value="£">£</option>
        <option value="¥">¥</option>
        <option value="₹">₹</option>
      </select>
      <button class="icon-toggle" id="darkToggle" title="Toggle dark mode">◐</button>
      <div class="month-total">
        <div class="label">taken out this month</div>
        <div class="value" id="monthTotal">$0.00</div>
      </div>
    </div>
  </header>
  <div id="saveIndicator" style="font-size:11px;color:var(--ink-soft);margin:-10px 0 18px;text-align:right;">All changes save automatically.</div>

  <div class="banner hide" id="reminderBanner">
    <span id="reminderText"></span>
    <button id="dismissBanner">dismiss</button>
  </div>

  <div class="budget-box">
    <div class="row">
      <span>Monthly budget limit</span>
      <input type="number" id="budgetInput" min="0" step="1" placeholder="e.g. 400">
    </div>
    <div class="bar-track"><div class="bar-fill" id="budgetFill" style="width:0%"></div></div>
    <div class="row" style="margin-top:6px;margin-bottom:0;">
      <span id="budgetStatus" style="color:var(--ink-soft);"></span>
      <span id="budgetRemaining" style="color:var(--ink-soft);"></span>
    </div>
    <div class="streak" id="streakText"></div>
  </div>

  <div class="nav">
    <button class="arrow" id="prevMonth" aria-label="Previous month">&lsaquo;</button>
    <div class="month-label" id="monthLabel"></div>
    <div class="view-toggle">
      <button class="textbtn" id="yearViewBtn">Year view</button>
    </div>
    <button class="arrow" id="nextMonth" aria-label="Next month">&rsaquo;</button>
  </div>

  <div id="monthView">
    <div class="grid" id="dowRow"></div>
    <div class="grid" id="calGrid"></div>

    <div class="panel" id="panel" style="display:none;">
      <p class="date-title" id="panelDate"></p>
      <div class="panel-row">
        <label for="amountInput">Amount</label>
        <input type="number" id="amountInput" step="0.01" min="0" placeholder="0.00">
        <label for="categorySelect">Category</label>
        <select id="categorySelect"></select>
      </div>
      <div class="panel-row">
        <label for="noteInput">Note</label>
        <input type="text" id="noteInput" placeholder="e.g. groceries, cash for weekend">
      </div>
      <div class="panel-row">
        <span class="checkbox-row"><input type="checkbox" id="recurringCheck"> Repeats monthly (auto-fills future months)</span>
      </div>
      <div class="actions">
        <button class="primary" id="saveBtn">Save</button>
        <button class="secondary" id="deleteBtn" style="display:none;">Delete entry</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div id="yearView" style="display:none;">
    <div class="year-grid" id="yearGrid"></div>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search notes or category...">
    <select id="sortSelect">
      <option value="date-desc">Newest first</option>
      <option value="date-asc">Oldest first</option>
      <option value="amount-desc">Largest amount</option>
      <option value="amount-asc">Smallest amount</option>
    </select>
  </div>

  <div class="list">
    <h2>This month's withdrawals</h2>
    <div id="listBody"></div>
  </div>

  <div class="section-title">Spending by month</div>
  <div class="chart-box">
    <canvas id="monthChart" height="140"></canvas>
  </div>

  <div class="section-title">By category</div>
  <div class="chart-box" id="catBreakdown"></div>

  <div class="section-title">Stats</div>
  <div class="stats-grid" id="statsGrid"></div>

  <div class="section-title">Your data</div>
  <div class="data-box">
    <button id="exportCsvBtn">Export CSV</button>
    <button id="backupBtn">Download backup (JSON)</button>
    <label class="filebtn">Restore from backup
      <input type="file" id="restoreInput" accept="application/json">
    </label>
  </div>
  <div class="import-box">
    <label style="font-size:12px;color:var(--ink-soft);">Paste past withdrawals to import — one per line, format: <code>YYYY-MM-DD, amount, category, note</code></label>
    <textarea id="pasteImport" placeholder="2026-08-03, 60, Groceries, weekly shop"></textarea>
    <div class="data-box" style="margin-top:8px;">
      <button id="pasteImportBtn">Import pasted lines</button>
    </div>
  </div>

</div>

<div class="toast hidden" id="undoToast">
  <span id="undoText">Entry removed</span>
  <button id="undoBtn">Undo</button>
</div>

<script>
const STORAGE_KEY = 'ledger-data-v1';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEFAULT_CATEGORIES = ['Groceries','Bills','Fun','Gifts','Transport','Other'];
const CAT_COLORS = {
  'Groceries':'#639922','Bills':'#378ADD','Fun':'#D4537E','Gifts':'#EF9F27',
  'Transport':'#7F77DD','Other':'#888780'
};

let state = {
  accounts: ['Checking'],
  currentAccount: 'Checking',
  currency: '$',
  darkMode: false,
  categories: DEFAULT_CATEGORIES,
  budgets: {},
  entries: {},
  lastOpened: null
};

let current = new Date();
current.setDate(1);
let selectedDate = null;
let lastDeleted = null;
let chartInstance = null;

const el = id => document.getElementById(id);
const monthLabel = el('monthLabel');
const calGrid = el('calGrid');
const dowRow = el('dowRow');
const panel = el('panel');
const panelDate = el('panelDate');
const amountInput = el('amountInput');
const noteInput = el('noteInput');
const categorySelect = el('categorySelect');
const recurringCheck = el('recurringCheck');
const saveBtn = el('saveBtn');
const deleteBtn = el('deleteBtn');
const statusEl = el('status');
const monthTotalEl = el('monthTotal');
const listBody = el('listBody');
const accountSelect = el('accountSelect');
const currencySelect = el('currencySelect');
const budgetInput = el('budgetInput');
const budgetFill = el('budgetFill');
const budgetStatus = el('budgetStatus');
const budgetRemaining = el('budgetRemaining');
const streakText = el('streakText');
const searchInput = el('searchInput');
const sortSelect = el('sortSelect');
const yearView = el('yearView');
const monthView = el('monthView');
const yearGrid = el('yearGrid');
const statsGrid = el('statsGrid');
const catBreakdown = el('catBreakdown');
const undoToast = el('undoToast');
const undoBtn = el('undoBtn');
const undoText = el('undoText');
const reminderBanner = el('reminderBanner');
const reminderText = el('reminderText');

DOW.forEach(d => {
  const d1 = document.createElement('div');
  d1.className = 'dow';
  d1.textContent = d;
  dowRow.appendChild(d1);
});

function fmtKey(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function fmtMoney(n){
  return state.currency + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function accountEntries(){
  if(!state.entries[state.currentAccount]) state.entries[state.currentAccount] = {};
  return state.entries[state.currentAccount];
}
function accountBudget(){
  if(!state.budgets[state.currentAccount]) state.budgets[state.currentAccount] = 0;
  return state.budgets[state.currentAccount];
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    // no data yet, use defaults
  }
  applyTheme();
  populateAccountSelect();
  populateCategorySelect();
  currencySelect.value = state.currency;
  checkReminder();
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    const ind = el('saveIndicator');
    if(ind){
      const now = new Date();
      ind.textContent = 'Saved at ' + now.toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'});
    }
  }catch(e){
    statusEl.textContent = 'Could not save. Try again.';
    const ind = el('saveIndicator');
    if(ind) ind.textContent = 'Could not save your last change.';
  }
}

function persistBeacon(){
  try{
    window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){
    // best-effort only, nothing more to do on unload
  }
}
window.addEventListener('beforeunload', persistBeacon);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') persistBeacon();
});

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
}

function populateAccountSelect(){
  accountSelect.innerHTML = '';
  state.accounts.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    accountSelect.appendChild(o);
  });
  accountSelect.value = state.currentAccount;
}

function populateCategorySelect(){
  categorySelect.innerHTML = '';
  state.categories.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    categorySelect.appendChild(o);
  });
}

function checkReminder(){
  const entries = accountEntries();
  const keys = Object.keys(entries).sort();
  if(keys.length === 0){ reminderBanner.classList.add('hide'); return; }
  const lastKey = keys[keys.length - 1];
  const lastDate = new Date(lastKey + 'T00:00:00');
  const days = Math.floor((new Date() - lastDate) / (1000*60*60*24));
  if(days >= 10){
    reminderText.textContent = `You haven't logged a withdrawal in ${days} days. Everything up to date?`;
    reminderBanner.classList.remove('hide');
  }else{
    reminderBanner.classList.add('hide');
  }
}

function render(){
  renderCalendar();
  renderBudget();
  renderList();
  renderChart();
  renderCategoryBreakdown();
  renderStats();
  budgetInput.value = accountBudget() || '';
}

function renderCalendar(){
  const y = current.getFullYear();
  const m = current.getMonth();
  monthLabel.textContent = current.toLocaleString(undefined,{month:'long', year:'numeric'});
  calGrid.innerHTML = '';
  const entries = accountEntries();
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = new Date();
  const todayKey = fmtKey(today.getFullYear(), today.getMonth(), today.getDate());

  for(let i=0;i<firstDow;i++){
    const cell = document.createElement('div');
    cell.className = 'cell empty';
    calGrid.appendChild(cell);
  }

  let monthTotal = 0;
  for(let d=1; d<=daysInMonth; d++){
    const key = fmtKey(y,m,d);
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(key === todayKey) cell.classList.add('today');
    if(entries[key]) cell.classList.add('has-entry');
    if(key === selectedDate) cell.classList.add('selected');

    const daynum = document.createElement('div');
    daynum.className = 'daynum';
    const numSpan = document.createElement('span');
    numSpan.textContent = d;
    daynum.appendChild(numSpan);
    if(entries[key]){
      const dot = document.createElement('span');
      dot.className = 'cat-dot';
      dot.style.background = CAT_COLORS[entries[key].category] || CAT_COLORS['Other'];
      daynum.appendChild(dot);
    }
    cell.appendChild(daynum);

    if(entries[key]){
      const amt = document.createElement('div');
      amt.className = 'amount';
      amt.textContent = fmtMoney(entries[key].amount) + (entries[key].recurring ? ' ↻' : '');
      cell.appendChild(amt);
      monthTotal += Number(entries[key].amount);
    }

    cell.addEventListener('click', () => openPanel(key));
    calGrid.appendChild(cell);
  }
  monthTotalEl.textContent = fmtMoney(monthTotal);
}

function renderBudget(){
  const y = current.getFullYear(), m = current.getMonth();
  const entries = accountEntries();
  let total = 0;
  Object.keys(entries).forEach(k => {
    const d = new Date(k + 'T00:00:00');
    if(d.getFullYear() === y && d.getMonth() === m) total += Number(entries[k].amount);
  });
  const budget = accountBudget();
  if(!budget || budget <= 0){
    budgetFill.style.width = '0%';
    budgetFill.classList.remove('over');
    budgetStatus.textContent = 'No budget set for this account.';
    budgetRemaining.textContent = '';
  }else{
    const pct = Math.min(100, (total/budget)*100);
    budgetFill.style.width = pct + '%';
    budgetFill.classList.toggle('over', total > budget);
    budgetStatus.textContent = total > budget ? 'Over budget' : 'On track';
    budgetRemaining.textContent = fmtMoney(Math.max(0,budget-total)) + ' left';
  }

  // streak: consecutive months under budget (or logged) - simplified: count past months with entries and under budget
  let streak = 0;
  for(let i=1;i<=12;i++){
    const dt = new Date(y, m-i, 1);
    const monthKeys = Object.keys(entries).filter(k=>{
      const d = new Date(k+'T00:00:00');
      return d.getFullYear()===dt.getFullYear() && d.getMonth()===dt.getMonth();
    });
    const monthSum = monthKeys.reduce((s,k)=>s+Number(entries[k].amount),0);
    if(budget && monthSum <= budget && monthKeys.length>0){
      streak++;
    }else{
      break;
    }
  }
  streakText.textContent = budget ? `${streak} month${streak===1?'':'s'} in a row under budget.` : '';
}

function getFilteredSortedEntries(){
  const y = current.getFullYear(), m = current.getMonth();
  const entries = accountEntries();
  let list = Object.keys(entries).map(k => ({key:k, ...entries[k]})).filter(e => {
    const d = new Date(e.key + 'T00:00:00');
    return d.getFullYear()===y && d.getMonth()===m;
  });
  const q = searchInput.value.trim().toLowerCase();
  if(q){
    list = list.filter(e => (e.note||'').toLowerCase().includes(q) || (e.category||'').toLowerCase().includes(q));
  }
  const sortVal = sortSelect.value;
  list.sort((a,b) => {
    if(sortVal === 'date-desc') return a.key < b.key ? 1 : -1;
    if(sortVal === 'date-asc') return a.key > b.key ? 1 : -1;
    if(sortVal === 'amount-desc') return b.amount - a.amount;
    if(sortVal === 'amount-asc') return a.amount - b.amount;
  });
  return list;
}

function renderList(){
  const list = getFilteredSortedEntries();
  if(list.length === 0){
    listBody.innerHTML = '<p class="empty-hint">Nothing logged yet. Click a day above to add one.</p>';
    return;
  }
  listBody.innerHTML = '';
  list.forEach(e => {
    const row = document.createElement('div');
    row.className = 'list-row';
    const dateObj = new Date(e.key + 'T00:00:00');
    const dLabel = dateObj.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    row.innerHTML = `<span class="d">${dLabel}</span><span class="n">${e.note ? e.note : ''}</span><span class="c">${e.category || ''}</span><span class="a">${fmtMoney(e.amount)}</span>`;
    listBody.appendChild(row);
  });
}

function renderChart(){
  const entries = accountEntries();
  const months = [];
  const totals = [];
  for(let i=5;i>=0;i--){
    const dt = new Date(current.getFullYear(), current.getMonth()-i, 1);
    const label = dt.toLocaleString(undefined,{month:'short'});
    const sum = Object.keys(entries).reduce((s,k)=>{
      const d = new Date(k+'T00:00:00');
      if(d.getFullYear()===dt.getFullYear() && d.getMonth()===dt.getMonth()) return s + Number(entries[k].amount);
      return s;
    },0);
    months.push(label);
    totals.push(Math.round(sum*100)/100);
  }
  const ctx = el('monthChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: months,
      datasets: [{ label: 'Withdrawn', data: totals, backgroundColor: '#9C4331' }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

function renderCategoryBreakdown(){
  const list = getFilteredSortedEntries();
  const all = accountEntries();
  const y = current.getFullYear(), m = current.getMonth();
  const monthList = Object.keys(all).filter(k=>{
    const d = new Date(k+'T00:00:00');
    return d.getFullYear()===y && d.getMonth()===m;
  }).map(k=>all[k]);

  const totals = {};
  let grandTotal = 0;
  monthList.forEach(e => {
    const cat = e.category || 'Other';
    totals[cat] = (totals[cat]||0) + Number(e.amount);
    grandTotal += Number(e.amount);
  });

  if(grandTotal === 0){
    catBreakdown.innerHTML = '<p class="empty-hint">No withdrawals yet this month.</p>';
    return;
  }
  catBreakdown.innerHTML = '';
  Object.keys(totals).sort((a,b)=>totals[b]-totals[a]).forEach(cat => {
    const pct = Math.round((totals[cat]/grandTotal)*100);
    const row = document.createElement('div');
    row.className = 'cat-breakdown-row';
    row.innerHTML = `
      <span class="name"><span class="cat-dot" style="background:${CAT_COLORS[cat]||CAT_COLORS['Other']}"></span>${cat}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${CAT_COLORS[cat]||CAT_COLORS['Other']}"></span></span>
      <span class="pct">${pct}%</span>
    `;
    catBreakdown.appendChild(row);
  });
}

function renderStats(){
  const entries = accountEntries();
  const all = Object.keys(entries).map(k => ({key:k, ...entries[k]}));
  statsGrid.innerHTML = '';
  if(all.length === 0){
    statsGrid.innerHTML = '<p class="empty-hint">Stats will show up once you log a few withdrawals.</p>';
    return;
  }
  const totalAll = all.reduce((s,e)=>s+Number(e.amount),0);
  const avg = totalAll/all.length;
  const biggest = all.reduce((a,b)=> Number(a.amount)>Number(b.amount)?a:b);
  const dowCounts = [0,0,0,0,0,0,0];
  all.forEach(e => { dowCounts[new Date(e.key+'T00:00:00').getDay()]++; });
  const maxDow = dowCounts.indexOf(Math.max(...dowCounts));

  const monthSums = {};
  all.forEach(e => {
    const d = new Date(e.key+'T00:00:00');
    const mk = `${d.getFullYear()}-${d.getMonth()}`;
    monthSums[mk] = (monthSums[mk]||0) + Number(e.amount);
  });
  const activeMonthKey = Object.keys(monthSums).reduce((a,b)=> monthSums[a]>monthSums[b]?a:b);
  const [ay,am] = activeMonthKey.split('-').map(Number);
  const activeMonthLabel = new Date(ay,am,1).toLocaleString(undefined,{month:'short', year:'numeric'});

  const stats = [
    {label:'Average withdrawal', value: fmtMoney(avg)},
    {label:'Total withdrawals logged', value: all.length},
    {label:'Biggest withdrawal', value: fmtMoney(biggest.amount)},
    {label:'Most active month', value: activeMonthLabel},
    {label:'Most common day', value: DOW[maxDow]},
    {label:'All-time total', value: fmtMoney(totalAll)}
  ];
  stats.forEach(s => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `<div class="label">${s.label}</div><div class="value">${s.value}</div>`;
    statsGrid.appendChild(card);
  });
}

function renderYearView(){
  yearGrid.innerHTML = '';
  const entries = accountEntries();
  const y = current.getFullYear();
  for(let m=0;m<12;m++){
    const sum = Object.keys(entries).reduce((s,k)=>{
      const d = new Date(k+'T00:00:00');
      if(d.getFullYear()===y && d.getMonth()===m) return s+Number(entries[k].amount);
      return s;
    },0);
    const cell = document.createElement('div');
    cell.className = 'year-cell';
    const label = new Date(y,m,1).toLocaleString(undefined,{month:'long'});
    cell.innerHTML = `<div class="m">${label}</div><div class="t">${fmtMoney(sum)}</div>`;
    cell.addEventListener('click', () => {
      current = new Date(y,m,1);
      monthView.style.display = 'block';
      yearView.style.display = 'none';
      render();
    });
    yearGrid.appendChild(cell);
  }
}

function openPanel(key){
  selectedDate = key;
  panel.style.display = 'block';
  const dateObj = new Date(key + 'T00:00:00');
  panelDate.textContent = dateObj.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'});
  statusEl.textContent = '';
  const entries = accountEntries();
  if(entries[key]){
    amountInput.value = entries[key].amount;
    noteInput.value = entries[key].note || '';
    categorySelect.value = entries[key].category || state.categories[0];
    recurringCheck.checked = !!entries[key].recurring;
    deleteBtn.style.display = 'inline-block';
  }else{
    amountInput.value = '';
    noteInput.value = '';
    categorySelect.value = state.categories[0];
    recurringCheck.checked = false;
    deleteBtn.style.display = 'none';
  }
  renderCalendar();
  amountInput.focus();
}

saveBtn.addEventListener('click', async () => {
  const val = parseFloat(amountInput.value);
  if(isNaN(val) || val <= 0){
    statusEl.textContent = 'Enter an amount greater than 0.';
    return;
  }
  const entries = accountEntries();
  entries[selectedDate] = {
    amount: val,
    note: noteInput.value.trim(),
    category: categorySelect.value,
    recurring: recurringCheck.checked
  };

  if(recurringCheck.checked){
    const [y,m,d] = selectedDate.split('-').map(Number);
    for(let i=1;i<=6;i++){
      const futureDate = new Date(y, m-1+i, d);
      const fKey = fmtKey(futureDate.getFullYear(), futureDate.getMonth(), futureDate.getDate());
      if(!entries[fKey]){
        entries[fKey] = { amount: val, note: noteInput.value.trim(), category: categorySelect.value, recurring: true };
      }
    }
  }

  await persist();
  statusEl.textContent = 'Saved.';
  deleteBtn.style.display = 'inline-block';
  render();
});

deleteBtn.addEventListener('click', async () => {
  const entries = accountEntries();
  lastDeleted = { account: state.currentAccount, key: selectedDate, value: entries[selectedDate] };
  delete entries[selectedDate];
  await persist();
  panel.style.display = 'none';
  selectedDate = null;
  render();
  showUndo();
});

function showUndo(){
  undoText.textContent = 'Entry removed.';
  undoToast.classList.remove('hidden');
  clearTimeout(showUndo._t);
  showUndo._t = setTimeout(()=> undoToast.classList.add('hidden'), 6000);
}
undoBtn.addEventListener('click', async () => {
  if(lastDeleted){
    if(!state.entries[lastDeleted.account]) state.entries[lastDeleted.account] = {};
    state.entries[lastDeleted.account][lastDeleted.key] = lastDeleted.value;
    await persist();
    lastDeleted = null;
    render();
  }
  undoToast.classList.add('hidden');
});

el('prevMonth').addEventListener('click', () => {
  current.setMonth(current.getMonth() - 1);
  panel.style.display = 'none';
  selectedDate = null;
  render();
});
el('nextMonth').addEventListener('click', () => {
  current.setMonth(current.getMonth() + 1);
  panel.style.display = 'none';
  selectedDate = null;
  render();
});
document.addEventListener('keydown', (e) => {
  if(document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
  if(e.key === 'ArrowLeft') el('prevMonth').click();
  if(e.key === 'ArrowRight') el('nextMonth').click();
});

el('yearViewBtn').addEventListener('click', () => {
  const showingYear = yearView.style.display !== 'none';
  if(showingYear){
    yearView.style.display = 'none';
    monthView.style.display = 'block';
  }else{
    renderYearView();
    yearView.style.display = 'block';
    monthView.style.display = 'none';
  }
});

accountSelect.addEventListener('change', () => {
  state.currentAccount = accountSelect.value;
  panel.style.display = 'none';
  selectedDate = null;
  persist();
  checkReminder();
  render();
});
el('addAccountBtn').addEventListener('click', async () => {
  const name = prompt('Name this account (e.g. Savings, Joint):');
  if(name && !state.accounts.includes(name)){
    state.accounts.push(name);
    state.currentAccount = name;
    populateAccountSelect();
    await persist();
    render();
  }
});

currencySelect.addEventListener('change', async () => {
  state.currency = currencySelect.value;
  await persist();
  render();
});

el('darkToggle').addEventListener('click', async () => {
  state.darkMode = !state.darkMode;
  applyTheme();
  await persist();
  renderChart();
});

budgetInput.addEventListener('change', async () => {
  const val = parseFloat(budgetInput.value);
  state.budgets[state.currentAccount] = isNaN(val) ? 0 : val;
  await persist();
  renderBudget();
});

searchInput.addEventListener('input', renderList);
sortSelect.addEventListener('change', renderList);

el('dismissBanner').addEventListener('click', () => reminderBanner.classList.add('hide'));

el('exportCsvBtn').addEventListener('click', () => {
  const entries = accountEntries();
  let csv = 'date,amount,category,note,recurring\n';
  Object.keys(entries).sort().forEach(k => {
    const e = entries[k];
    csv += `${k},${e.amount},${e.category||''},"${(e.note||'').replace(/"/g,'""')}",${e.recurring?'yes':'no'}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.currentAccount}-withdrawals.csv`;
  a.click();
});

el('backupBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'withdrawal-ledger-backup.json';
  a.click();
});

el('restoreInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const parsed = JSON.parse(ev.target.result);
      state = Object.assign(state, parsed);
      populateAccountSelect();
      populateCategorySelect();
      currencySelect.value = state.currency;
      applyTheme();
      await persist();
      render();
      alert('Backup restored.');
    }catch(err){
      alert('That file could not be read as a valid backup.');
    }
  };
  reader.readAsText(file);
});

el('pasteImportBtn').addEventListener('click', async () => {
  const lines = el('pasteImport').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const entries = accountEntries();
  let count = 0;
  lines.forEach(line => {
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length < 2) return;
    const [date, amountStr, category, ...noteParts] = parts;
    const amount = parseFloat(amountStr);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(amount)) return;
    entries[date] = {
      amount: amount,
      category: category || 'Other',
      note: noteParts.join(', ') || '',
      recurring: false
    };
    count++;
  });
  if(count > 0){
    await persist();
    el('pasteImport').value = '';
    render();
    statusEl.textContent = '';
    alert(`Imported ${count} withdrawal${count===1?'':'s'}.`);
  }else{
    alert('No valid lines found. Use format: YYYY-MM-DD, amount, category, note');
  }
});

loadData();
</script>
</body>
</html>
